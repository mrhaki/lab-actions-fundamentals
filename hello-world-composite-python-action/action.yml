name: Hello world composite Python action
description: A simple composite Python action that prints "Hello, world!"

inputs:
  who-to-greet:
    description: The name of the person to greet
    required: true
    default: "World"

outputs:
  time:
    description: The time at which the greeting was made
    value: ${{ steps.get-time.outputs.time }}

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Say hello
      shell: bash
      run: python greet.py
      working-directory: ${{ github.action_path }}
      env:
        WHO_TO_GREET: ${{ inputs.who-to-greet }}
