name: Hello world composite Python action
description: A simple composite Python action that prints "Hello, world!"

inputs:
  who-to-greet:
    description: The name of the person to greet
    required: true
    default: "World"

outputs:
  time:
    description: The time at which the greeting was made
    value: ${{ steps.get-time.outputs.time }}

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7

    - name: Say hello
      shell: python
      run: |
        import os
        who_to_greet = os.getenv("WHO_TO_GREET")
        print(f"Hello, {who_to_greet}!")

        # Workflow command: show an annotation in the run summary
        print(f"::notice::Greeted **{who_to_greet}**")
      env:
        WHO_TO_GREET: ${{ inputs.who-to-greet }}

    - name: Set output time
      id: get-time
      shell: python
      run: |
        import os
        from datetime import datetime, timezone

        # Write outputs to the file in GITHUB_OUTPUT (not ::set-output)
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"time={datetime.now(timezone.utc).isoformat()}\n")        
