name: Hello world bash
description: Saying hello
inputs:
  who-to-greet:
    required: true
    description: Who to greet
    default: 'world'
outputs:
  time:
    description: 'The time we greeted you'
    value: ${{ steps.time.output.time }}
runs:
  using: composite
  steps:
    - name: Set greeting
      run: echo ${{ inputs.who-to-greet }}
      shell: bash

    - name: Get time
      id: time
      shell: bash
      run: echo "time=($date)" >> $GITHUB_OUTPUT

    - name: Add action path to path
      run: echo "$GITHUB_ACTION_PATH" >> $GITHUB_PATH
      shell: bash

    - name: Say goodbye
      run: goodby.sh
      shell: bash
      env:
        time: ${{ steps.time.outputs.time }}
