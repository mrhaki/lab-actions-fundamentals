name: CI Build for custom actions
on:
  push:
    branches:
      - main
    paths: 
      - './hello-world-action/**'
      - './hello-world-composite-bash-action/**'
      - './hello-world-composite-pwsh-action/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Custom action
        id: hello-action
        uses: $/hello-world-action
        with:
          who-to-greet: '@mrhaki'

      - name: Show time
        run: echo "The time was $TIME when the action said hello"
        env:
          TIME: ${{ steps.hello-action.outputs.time }}

  composite-bash:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Custom composite bash action
        id: hello-composite-bash-action
        uses: $/hello-world-composite-bash-action
        with:
          who-to-greet: '@mrhaki'

      - name: Show time
        run: echo "The time was $TIME when the action said hello"
        shell: bash
        env:
          TIME: ${{ steps.hello-composite-bash-action.outputs.time }}
  
  composite-pwsh:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Custom composite PowerShell action
        id: hello-composite-pwsh-action
        uses: $/hello-world-composite-pwsh-action
        with:
          who-to-greet: '@mrhaki'

      - name: Show time
        run: echo "The time was $TIME when the action said hello"
        shell: bash
        env:
          TIME: ${{ steps.hello-composite-pwsh-action.outputs.time }}