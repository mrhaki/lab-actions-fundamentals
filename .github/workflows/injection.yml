name: Injection Workflow

on:
  pull_request:
    types:
      - opened
      - edited

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Print message
        run: |
          echo "Injection workflow triggered by pull request. ${TITLE}"
          echo "Direct access to pull request title: ${{ github.event.pull_request.title }}"
        env:
          TITLE: ${{ github.event.pull_request.title }}