name: Reuse other workflow

on:
  workflow_dispatch:

jobs:
  call-workflow:
    uses: $/.github/workflows/reusable.yml
    with:
      who-to-greet: "@mrhaki"

  use-output:
    runs-on: ubuntu-latest
    needs: 
      - call-workflow
    steps:
      - name: Print current time
        shell: bash
        run: echo "Time was $CURRENT_TIME"
        env:
          CURRENT_TIME: ${{ needs.call-workflow.outputs.current-time }}