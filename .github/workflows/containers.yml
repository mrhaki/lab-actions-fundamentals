name: GitHub Actions Containers

on:
  workflow_dispatch:

permissions:
  contents: read
  
jobs:
  step-conainer:
    runs-on: ubuntu-latest
    steps:
      - name: Custom docker image
        uses: 'docker://alpine:3.22'
        with:
          entrypoint: /bin/sh
          args: -c "cat /etc/os-release"

  job-container:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm-slim
    services:
      redis:
        image: redis
        ports:
          - 6379/tcp
    steps:
      - name: Show node version
        run: |
          node --version
          cat /etc/os-release
          node -e "const s=require('net').connect(6379,'redis',()=>{s.write('PING\r\n')});s.on('data',d=>{console.log(d.toString());s.end()})"
  
  missing-tools:
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Needs git and bash
        shell: bash
        run: git log -1
