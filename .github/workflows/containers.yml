name: GitHub Actions Containers

on:
  workflow_dispatch:

jobs:
  step-conainer:
    runs-on: ubuntu-latest
    steps:
      - name: Custom docker image
        uses: 'docker://alpine:3.22'
        with:
          entrypoint: /bin/sh
          args: -c "cat /etc/os-release"

  job-container:
    runs-on: ubuntu:latest
    container: node:22-bookworm-slim
    steps:
      - name: Show node version
        run: |
          node --version
          cat /etc/os-release
          
