name: Hello world PowerShell

inputs:
  who-to-greet:
    required: true
    description: Who to greet
    default: 'world'

outputs:
  time:
    description: 'The time we greeted you'
    value: ${{ steps.get-time.outputs.time }}

runs:
  using: composite
  steps:
    - name: Set greeting
      run: Write-Host "Hello $env:WHO_TO_GREET"
      shell: pwsh
      env:
        WHO_TO_GREET: ${{ inputs.who-to-greet }}

    - name: Get time
      id: get-time
      shell: pwsh
      run: |
        "time=$(Get-Date -Format o)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Say goodbye
      run: ./goodbye.ps1
      shell: pwsh
      working-directory: ${{ github.action_path }}
      env:
        TIME: ${{ steps.get-time.outputs.time }}