name: Hello world PowerShell

inputs:
  who-to-greet:
    required: true
    description: Who to greet
    default: 'world'

outputs:
  time:
    description: 'The time we greeted you'
    value: ${{ steps.get-time.outputs.time }}

runs:
  using: composite
  steps:
    - name: Set greeting
      run: Write-Host ${{ inputs.who-to-greet }}
      shell: pwsh

    - name: Get time
      id: get-time
      shell: pwsh
      run: Write-Host "time=$(Get-Date -Format o)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Say goodbye
      run: ./goodbye.ps1
      shell: pwsh
      working-directory: ${{ github.action_path }}
      env:
        time: ${{ steps.get-time.outputs.time }}